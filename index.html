<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños!</title>
    <style>
        /* Importamos una fuente dramática para el título */
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto&display=swap');

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-image: url(recursos/kamu.jpg); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            background: rgba(0, 0, 0, 0.85); /* Fondo oscuro semitransparente */
            padding: 40px;
            max-width: 800px;
            margin: 50px auto;
            border: 2px solid #e5a93d; /* Borde dorado Yakuza */
            box-shadow: 0 0 20px #e5a93d;
            border-radius: 10px;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 4em;
            color: #ffffff;
            /* Efecto de neón rosa estilo Yakuza 0 */
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 15px #ff007f; 
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .dance-img {
            width: 150px;
            height: 150px;
            border-radius: 50%; /* Hace la imagen redonda */
            border: 3px solid #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .mensaje {
            font-style: italic;
            font-size: 1.2em;
            margin-top: 20px;
            color: #cccccc;
            line-height: 1.5;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>¡Feliz Cumpleaños!</h1>        
        <p></p>

        <img src="recursos/you.jpg" alt="You" style="max-width: 100%; border-radius: 5px; margin: 20px 0;">

        <div class="morgan-freeman-section">
            <img src="recursos/gordondance.gif" alt="Freeman dance" class="dance-img">
            <p class="mensaje">Feliz cumpleaños Leo... 20 años la criatura</p>
            
            <p><small>Otro año más feo</small></p>
        </div>
    </div>

</body>
</html>
